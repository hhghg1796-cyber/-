workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Generate wrapper and build APK
        script: |
          cd $CM_BUILD_DIR/maktaba
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/*.apk"
      
