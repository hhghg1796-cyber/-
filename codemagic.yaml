workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Build APK
        script: |
          cd $CM_BUILD_DIR/maktaba
          chmod +x gradlew || true
          ./gradlew assembleDebug
    artifacts:
      - "**/*.apk"
